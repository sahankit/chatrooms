services:
  - type: web
    name: chatrooms
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADSENSE_CLIENT
        sync: false
      - key: ADSENSE_SLOT_TOP
        sync: false
      - key: ADSENSE_SLOT_BOTTOM
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
      - key: YANDEX_VERIFICATION
        sync: false
      - key: INDEXNOW_KEY
        sync: false
